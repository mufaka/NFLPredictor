[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nflpredictor"
version = "0.1.0"
description = "NFL game outcome predictor — data build, feature engineering, splits, baseline ladder."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "rapidfuzz>=3.9",
    "pyarrow==24.0.*",
    "pyyaml>=6",
    "torch>=2.4",
    "matplotlib>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
