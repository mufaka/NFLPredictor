training_version: "v3"

seed: 1729
device: "auto"   # one of "auto" | "cpu" | "cuda"

one_hot_threshold: 8   # vocab size <= this → one-hot; > this → embedding

rungs:      [mean, team_mean, linear, mlp]
shapes:     [flat, pos]
strategies: [S1, S3]

linear:
  lr: 0.001
  batch_size: 32
  max_epochs: 200
  early_stop_patience: 20

mlp:
  lr: 0.001
  batch_size: 32
  max_epochs: 200
  early_stop_patience: 20
  hidden_dim: 256
  activation: "gelu"
  dropout: 0.1

embedding_dims:
  Archetype:   16
  team_codes:   8
  coaches:      8
  officials:    8
  positions:    8
  stadium:      8
