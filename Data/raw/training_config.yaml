training_version: "v4"

seed: 1729
device: "auto"   # one of "auto" | "cpu" | "cuda"

one_hot_threshold: 8   # vocab size <= this → one-hot; > this → embedding

rungs:      [mean, team_mean, linear, mlp]
shapes:     [flat, pos]
strategies: [season_holdout]   # add loso_cv to also train the CV folds (~6x cost)

linear:
  lr: 0.001
  batch_size: 32
  max_epochs: 200
  early_stop_patience: 20

mlp:
  lr: 0.001
  batch_size: 32
  max_epochs: 200
  early_stop_patience: 20
  hidden_dim: 256
  activation: "gelu"
  dropout: 0.1

# Embedding dims per high-cardinality vocab key. team_codes / coaches /
# officials are listed in NON_MODEL_VOCAB_KEYS (train/encoders.py) — they are
# identity-only and currently excluded from the model input, so their dims
# here are inert. They are kept for when those keys gain a numeric rating.
embedding_dims:
  archetype:   16
  team_codes:   8
  coaches:      8
  officials:    8
  positions:    8
  stadium:      8
