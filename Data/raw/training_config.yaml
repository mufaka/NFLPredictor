training_version: "v4"

seed: 1729
device: "auto"   # one of "auto" | "cpu" | "cuda"

one_hot_threshold: 8   # vocab size <= this → one-hot; > this → embedding

rungs:      [mean, team_mean, linear, mlp]
shapes:     [flat, pos]
strategies: [season_holdout]   # add loso_cv to also train the CV folds (~6x cost)

linear:
  lr: 0.001
  batch_size: 32
  max_epochs: 200
  early_stop_patience: 20

mlp:
  lr: 0.001
  batch_size: 32
  max_epochs: 200
  early_stop_patience: 20
  hidden_dim: 256
  activation: "gelu"
  dropout: 0.1

# Embedding dims per high-cardinality vocab key. team_codes is identity-only
# (NON_MODEL_VOCAB_KEYS in train/encoders.py): it stays in the parquet for the
# team_mean baseline but is excluded from the model input, so its dim here is
# inert and only present because config validation requires every high-card
# key. position / positions / stadium are real learned features.
embedding_dims:
  position:    16
  positions:    8
  stadium:      8
  team_codes:   8
